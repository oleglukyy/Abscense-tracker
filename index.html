<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absence Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__row">
        <h1 class="header__title">Absence Tracker</h1>
        <a
          href="https://seneca.juntadeandalucia.es/seneca/jsp/portal/"
          target="_blank"
          rel="noopener noreferrer"
          class="header__link"
        >
          Registro de faltas
        </a>
      </div>
      <p class="header__subtitle">Sube tu archivo TXT para analizar tus faltas</p>
    </header>
 
    <main class="main">
      <section class="upload-section" id="uploadSection">
        <label class="upload-label" for="fileInput" id="dropZone">
          <p class="upload-label__text">Arrastra tu archivo o haz clic para seleccionar</p>
          <p class="upload-label__hint">Archivos .txt</p>
          <input type="file" id="fileInput" accept=".txt" class="upload-input" />
        </label>
        <p class="upload-note">
          Un nombre de asignatura por línea. Las repeticiones cuentan como faltas adicionales.
        </p>
      </section>
 
      <section class="results-section hidden" id="resultsSection">
        <div class="results-header">
          <h2 class="results-header__title">Resultados</h2>
          <button class="btn-reset" id="resetBtn">Subir otro archivo</button>
        </div>
 
        <div class="summary-bar" id="summaryBar"></div>
 
        <ul class="subject-list" id="subjectList"></ul>
      </section>
    </main>
 
    <footer class="footer">
      <p>Edita <code>SUBJECT_CONFIG</code> en <code>main.js</code> para ajustar las horas por asignatura.</p>
    </footer>
 
    <script src="main.js"></script>
  </body>
</html>
